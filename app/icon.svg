<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ArpenArt">
  <!--
    The mark is the stamp grid — the thing actually printed across the totes and
    the scarves — reduced to four cells.

    It is not a monogram and not a landscape on purpose. Both were drawn and
    rendered at 16px first: two letters turn to mush, and an Ararat silhouette
    under a sun is pixel-for-pixel the broken-image glyph every browser ships.
    Four blocks of colour survive the downscale intact, which is the only test
    a favicon has to pass.

    Colours are from the measured palette: marigold #EFAB23, sky #568FC3,
    terracotta #D1622D and paper #FCF2E6 on ink #232834. Four clearly separated
    values, so none of the cells merges with its neighbour at small sizes.
  -->
  <rect width="64" height="64" rx="14" fill="#232834"/>
  <rect x="9"  y="9"  width="21" height="21" rx="2" fill="#EFAB23"/>
  <rect x="34" y="9"  width="21" height="21" rx="2" fill="#568FC3"/>
  <rect x="9"  y="34" width="21" height="21" rx="2" fill="#D1622D"/>
  <rect x="34" y="34" width="21" height="21" rx="2" fill="#FCF2E6"/>
</svg>
